name: Release

# scripts/release pushes a signed tag whose message holds the release notes.
# This workflow publishes the GitHub release from it. Run it by hand with a
# tag name to publish a release for a tag that already exists. The container
# image is not built here: owncloud-docker/ocis-agent builds it from the same
# signed tag (plain vX.Y.Z tags only, no pre-releases) and publishes it to
# Docker Hub as owncloud/ocis-agent.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check that the tag is signed and read the release notes
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$TAG is a lightweight tag. Create it with scripts/release."
            exit 1
          fi
          tag=$(gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<<"$ref")")
          if [ "$(jq -r .verification.verified <<<"$tag")" != true ]; then
            echo "::error::The signature of $TAG is not verified."
            exit 1
          fi
          # Drop the first line (the version) and the blank line after it, and
          # any signature block the API adds to the message.
          jq -r .message <<<"$tag" | tail -n +3 | sed '/^-----BEGIN .* SIGNATURE-----$/,$d' >notes.md
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          NOTES: ${{ runner.temp }}/release-notes/notes.md
        run: |
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" "${prerelease[@]}"
